<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>激光原理课程设计</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="spot.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js" defer></script>
  <script src="script.js" defer></script>
  <script src="animation.js" defer></script>
  <script src="spot.js" defer></script>
</head>
<body>
  <header class="page-header">
    <p class="course-name">激光原理课程设计</p>
    <h1>高斯光束传播基础页面</h1>
    <div class="nav-buttons">
      <button class="nav-btn" onclick="window.location.href='propagation.html'">📡 传播仿真</button>
      <button class="nav-btn" onclick="window.location.href='3d-beam.html'">🎯 三维光束</button>
      <button class="nav-btn" onclick="window.location.href='sensitivity.html'">📊 参数敏感性分析</button>
      <button class="nav-btn" onclick="window.location.href='experiment.html'">🔬 教学实验</button>
      <button class="nav-btn" onclick="window.location.href='dataCenter.html'">📊 数据中心</button>
    </div>
  </header>

  <main class="page-container">
    <div id="spotContainer" class="spot-display-section"></div>

    <div class="page-layout">
      <aside class="panel control-panel" aria-labelledby="control-title">
      <h2 id="control-title">参数控制区</h2>

      <form class="parameter-form">
        <div class="input-group">
          <label for="wavelength">波长 λ</label>
          <div class="input-row">
            <input id="wavelength" name="wavelength" type="number" placeholder="632.8">
            <span class="unit">nm</span>
          </div>
        </div>

        <div class="input-group">
          <label for="waist">束腰 w0</label>
          <div class="input-row">
            <input id="waist" name="waist" type="number" placeholder="0.5">
            <span class="unit">mm</span>
          </div>
        </div>

        <div class="input-group">
          <label for="distance">传播距离 z</label>
          <div class="input-row">
            <input id="distance" name="distance" type="number" placeholder="5.0">
            <span class="unit">m</span>
          </div>
        </div>

        <button type="button" class="primary-button">确认参数</button>
      </form>
    </aside>

    <section class="panel display-panel" aria-labelledby="display-title">
      <h2 id="display-title">光束传播显示区</h2>

      <div class="beam-display" aria-label="光束传播显示区域">
        <div id="beamChart" class="beam-chart" style="width: 100%; height: 100%;"></div>
      </div>
    </section>

    <aside class="panel result-panel" aria-labelledby="result-title">
      <h2 id="result-title">计算结果区</h2>

      <div class="result-list">
        <div class="result-item">
          <span>瑞利长度 zR</span>
          <strong>--</strong>
        </div>
        <div class="result-item">
          <span>光束半径 w(z)</span>
          <strong>--</strong>
        </div>
        <div class="result-item">
          <span>发散角 θ</span>
          <strong>--</strong>
        </div>
      </div>
    </aside>
    </div>
  </main>
</body>
</html>
